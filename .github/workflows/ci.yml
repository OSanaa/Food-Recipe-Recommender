name: CI

on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: ./backend
        run: | 
          pip install -r requirements.txt
      
      - name: Import app
        env:
          DATABASE_URL: "postgresql+asyncpg://neondb_owner:**************@ep-icy-frog-anjqzqt4-pooler.c-6.us-east-1.aws.neon.tech/neondb?sslmode=require"
        working-directory: ./backend
        run: | 
          python -c "import app.main"
