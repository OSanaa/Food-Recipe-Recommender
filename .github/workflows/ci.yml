name: CI

on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: ./backend
        run: | 
          pip install -r requirements.txt
      
      - name: Import app
        working-directory: ./backend/app
        run: | 
          python -c import "*"
